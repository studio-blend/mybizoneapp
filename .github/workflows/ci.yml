name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CI: true
  DATABASE_URL: postgres://mybizone:mybizone@localhost:5432/mybizone
  BETTER_AUTH_SECRET: ci-only-secret-do-not-use-anywhere-else-min-16-chars
  BETTER_AUTH_URL: http://localhost:3000
  RESEND_API_KEY: ''
  EMAIL_FROM: 'MyBizOne <noreply@mybizone.local>'
  NEXT_PUBLIC_SENTRY_DSN: ''
  SENTRY_AUTH_TOKEN: ''
  NEXT_PUBLIC_POSTHOG_KEY: ''
  NEXT_PUBLIC_POSTHOG_HOST: 'https://us.i.posthog.com'
  STORAGE_BACKEND: local
  NODE_ENV: test

jobs:
  lint-typecheck:
    name: Lint + Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Reuse .env.example for the env-file expected by dotenv-cli scripts.
      - run: cp .env.example .env
      - run: pnpm lint
      - run: pnpm typecheck

  unit-tests:
    name: Unit + RLS tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mybizone
          POSTGRES_PASSWORD: mybizone
          POSTGRES_DB: mybizone
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Write .env from CI secrets
        run: |
          cat > .env <<EOF
          DATABASE_URL=$DATABASE_URL
          BETTER_AUTH_SECRET=$BETTER_AUTH_SECRET
          BETTER_AUTH_URL=$BETTER_AUTH_URL
          NODE_ENV=$NODE_ENV
          EOF
      - run: pnpm db:migrate
      - run: pnpm test

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs: [unit-tests]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mybizone
          POSTGRES_PASSWORD: mybizone
          POSTGRES_DB: mybizone
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Write .env from CI secrets
        run: |
          cat > .env <<EOF
          DATABASE_URL=$DATABASE_URL
          BETTER_AUTH_SECRET=$BETTER_AUTH_SECRET
          BETTER_AUTH_URL=$BETTER_AUTH_URL
          NODE_ENV=production
          EOF
      - run: pnpm db:migrate
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/web
      - run: pnpm build
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
