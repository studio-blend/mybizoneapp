name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mybizone/web build
      - uses: actions/upload-artifact@v4
        with:
          name: web-standalone
          path: apps/web/.next/standalone/

  build-launcher:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            binary: mybizonelaunch.exe
          - os: ubuntu-latest
            binary: mybizonelaunch-linux
          - os: macos-latest
            # macOS: .dmg creation requires macOS runner + create-dmg tool
            # Apple notarization requires paid Apple Developer account ($99/yr)
            # Current: ships raw binary; .dmg + notarization in a future release
            binary: mybizonelaunch-macos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.22' }
      - name: Build launcher
        run: |
          cd packages/desktop
          go build -ldflags="-X main.Version=${{ github.ref_name }}" -o ${{ matrix.binary }} .
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-${{ matrix.os }}
          path: packages/desktop/${{ matrix.binary }}

  build-installer:
    needs: [build-web, build-launcher]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download web standalone
        uses: actions/download-artifact@v4
        with: { name: web-standalone, path: apps/web/.next/standalone }
      - name: Download Windows launcher
        uses: actions/download-artifact@v4
        with: { name: launcher-windows-latest, path: packages/desktop/installer }
      - name: Install Inno Setup
        run: choco install innosetup -y
      - name: Compile installer
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          iscc /DAppVersion=$version packages/desktop/installer/setup.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: packages/desktop/installer/output/MyBizOne-Setup-*.exe

  release:
    needs: [build-web, build-launcher, build-installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with: { path: dist/ }
      - name: Create Windows zip
        run: |
          mkdir -p release/windows
          cp -r dist/web-standalone/* release/windows/
          cp dist/launcher-windows-latest/mybizonelaunch.exe release/windows/
          echo "# NOTE: Portable Postgres and Node.js must be bundled separately." > release/windows/README.txt
          echo "# Download from: https://github.com/YOUR_ORG/mybizonelaunch/releases" >> release/windows/README.txt
          cd release && zip -r ../MyBizOne-${{ github.ref_name }}-windows.zip windows/
      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            --title "MyBizOne ${{ github.ref_name }}" \
            --generate-notes \
            MyBizOne-${{ github.ref_name }}-windows.zip \
            dist/launcher-ubuntu-latest/mybizonelaunch-linux \
            dist/launcher-macos-latest/mybizonelaunch-macos \
            dist/windows-installer/MyBizOne-Setup-*.exe
