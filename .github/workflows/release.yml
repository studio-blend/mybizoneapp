name: Release candidate

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloud-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate cloud image build
        run: docker build --tag mybizone:release-candidate .

  windows:
    runs-on: windows-latest
    env:
      DATABASE_URL: postgres://build:build@localhost:5432/build
      BETTER_AUTH_SECRET: release-build-placeholder-never-a-runtime-secret
      BETTER_AUTH_URL: http://localhost:3000
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.12.0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: pnpm }
      - uses: actions/setup-go@v5
        with: { go-version: '1.22' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Test desktop
        working-directory: packages/desktop
        run: go test ./...
      - name: Build Windows-native web application
        run: pnpm --filter @mybizone/web build
      - name: Stage complete application
        run: node scripts/package-desktop.mjs
      - name: Build launcher
        working-directory: packages/desktop
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: go build -ldflags="-X main.Version=$env:RELEASE_VERSION" -o ../../dist/desktop/mybizonelaunch.exe .
      - name: Bundle verified portable runtimes and seller license
        env:
          NODE_RUNTIME_URL: ${{ vars.NODE_RUNTIME_URL }}
          NODE_RUNTIME_SHA256: ${{ vars.NODE_RUNTIME_SHA256 }}
          POSTGRES_RUNTIME_URL: ${{ vars.POSTGRES_RUNTIME_URL }}
          POSTGRES_RUNTIME_SHA256: ${{ vars.POSTGRES_RUNTIME_SHA256 }}
          SELLER_LICENSE_TEXT: ${{ secrets.SELLER_LICENSE_TEXT }}
        run: ./scripts/stage-desktop-runtimes.ps1
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Compile installer
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_VERSION.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+$') { $version = '0.0.0' }
          & 'C:/Program Files (x86)/Inno Setup 6/ISCC.exe' /DAppVersion=$version packages/desktop/installer/setup.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer-candidate
          path: packages/desktop/installer/output/MyBizOne-Setup-*.exe
          if-no-files-found: error
      - name: Archive portable distribution
        run: Compress-Archive -Path dist/desktop/* -DestinationPath dist/MyBizOne-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable-candidate
          path: dist/MyBizOne-windows.zip

  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [cloud-image, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: release-artifacts }
      - name: Create draft for signing and acceptance checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --draft --title "MyBizOne $RELEASE_TAG candidate" \
            --notes-file docs/release/CANDIDATE_NOTES.md \
            release-artifacts/windows-installer-candidate/*.exe \
            release-artifacts/windows-portable-candidate/*.zip
