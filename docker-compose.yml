services:
  db:
    image: postgres:16-alpine
    container_name: mybizone-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mybizone
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your deployment environment}
      POSTGRES_DB: mybizone
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mybizone -d mybizone"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPPORT_WHATSAPP: ${NEXT_PUBLIC_SUPPORT_WHATSAPP:-}
        NEXT_PUBLIC_RAZORPAY_KEY_ID: ${NEXT_PUBLIC_RAZORPAY_KEY_ID:-}
    container_name: mybizone-app
    restart: unless-stopped
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:3000:3000"
    environment:
      DATABASE_URL: postgres://mybizone:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/mybizone
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set a random BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      LICENSE_KEY: ${LICENSE_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      RAZORPAY_PLAN_ID_MONTHLY: ${RAZORPAY_PLAN_ID_MONTHLY:-}
      RAZORPAY_PLAN_ID_ANNUAL: ${RAZORPAY_PLAN_ID_ANNUAL:-}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_DIR: /app/storage
      NODE_ENV: ${NODE_ENV:-production}
      LAN_MODE: ${LAN_MODE:-false}
    volumes:
      - storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health 2>/dev/null | grep -q '\"status\":\"ok\"'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  dbdata:
  storage:
