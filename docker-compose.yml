services:
  db:
    image: postgres:16-alpine
    container_name: mybizone-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mybizone
      POSTGRES_PASSWORD: mybizone
      POSTGRES_DB: mybizone
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mybizone -d mybizone"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dbdata:
